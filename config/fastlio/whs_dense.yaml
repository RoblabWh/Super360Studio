/**:
    ros__parameters:
        feature_extract_enable: false
        point_filter_num: 1          # MAX DENSITY: keep every raw point (no decimation)
        max_iteration: 4
        filter_size_surf: 0.2        # finer scan downsample for EKF (denser registration)
        filter_size_map: 0.2         # finer ikd-tree map resolution
        cube_side_length: 1000.0
        runtime_pos_log_enable: false
        map_file_path: "./test.pcd"

        common:
            lid_topic:  "/livox/lidar"
            imu_topic:  "/livox/imu"
            time_sync_en: false
            time_offset_lidar_to_imu: 0.0

        preprocess:
            lidar_type: 1            # Livox CustomMsg
            scan_line:  4            # Mid-360
            blind: 0.5               # drop points < 0.5 m (drone body / propeller zone)
            timestamp_unit: 3
            scan_rate: 10

        mapping:
            acc_cov: 0.1
            gyr_cov: 0.1
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            fov_degree:    360.0
            det_range:     100.0
            extrinsic_est_en:  true
            extrinsic_T: [ -0.011, -0.02329, 0.04412 ]
            extrinsic_R: [ 1., 0., 0.,
                            0., 1., 0.,
                            0., 0., 1.]

        publish:
            path_en: true
            effect_map_en: false
            map_en: true
            scan_publish_en:  true
            dense_publish_en: true   # MAX DENSITY: save full undistorted scan, not downsampled
            scan_bodyframe_pub_en: true

        pcd_save:
            pcd_save_en: true        # accumulate every scan -> PCD/scans.pcd at shutdown
            interval: -1             # all frames in ONE pcd file
